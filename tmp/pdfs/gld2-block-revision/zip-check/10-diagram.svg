<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">10  Cakupan, sumber, dan catatan verifikasi</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#5D7180">Diagram lengkap pada tingkat blok; detail seluruh komponen dan pin disertakan sebagai lampiran digital.</text><rect x="40" y="140" width="1120" height="137" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="140" width="5" height="137" rx="2" fill="#316FC0" stroke="#316FC0"/><text x="56" y="166.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Sumber yang diperiksa</text><text x="56" y="189.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Arsip utama: docs/wiring/gld-project-ver2-2026-07-01/source-GLD2.zip</text><text x="56" y="206.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Arsip di dalamnya: MotherBoardGLDVer1_6c18d214f6b6445f816f6824785b8234.zip</text><text x="56" y="223.44000000000003" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Isi: 1-Schematic_MotherBoardGLDVer1.json (Sheet_1) + 1-PCB_PCB_MotherBoardGLDVer1.json</text><text x="56" y="240.24000000000004" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Gambar terpisah: references/sensor-module-tps22919-h1-h8.png</text><text x="56" y="257.04" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Nama internal MotherBoardGLDVer1 dipertahankan sebagai identitas file sumber, bukan penentuan versi produk.</text><text x="56" y="300.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#5D7180">SHA-256 arsip: aeb3d54180c596c5ee7fbc9adbb51e434651a238b19a31429d8cf5c82ec985f1</text><rect x="40" y="330" width="1120" height="34" rx="3" fill="#183044" stroke="#183044"/><text x="49" y="348.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">Area</text><text x="269" y="348.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="white">Hasil pembacaan / batas bukti</text><rect x="40" y="364" width="1120" height="34" rx="0" fill="white" stroke="white"/><text x="49" y="382.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Cakupan motherboard</text><text x="269" y="382.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">1 sheet; 204 komponen/simbol, termasuk casing dan komponen pasif.</text><rect x="40" y="398" width="1120" height="34" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="416.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Pemetaan net</text><text x="269" y="416.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Nama pin schematic dicocokkan dengan pad PCB; 0 perbedaan pada pin berlabel net.</text><rect x="40" y="432" width="1120" height="34" rx="0" fill="white" stroke="white"/><text x="49" y="450.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Sumber analog +5VA</text><text x="269" y="450.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Tidak ditemukan koneksi suplai ke +5VA motherboard; jangan disatukan secara asumsi.</text><rect x="40" y="466" width="1120" height="34" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="484.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Modul sensor</text><text x="269" y="484.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Gambar referensi saja; pinout berbeda dari header motherboard. Perlu padanan koneksi.</text><rect x="40" y="500" width="1120" height="34" rx="0" fill="white" stroke="white"/><text x="49" y="518.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Identitas sensor</text><text x="269" y="518.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">MQ2 tertulis pada gambar contoh. Penempatan jenis MQ tiap kanal tidak tercantum.</text><rect x="40" y="534" width="1120" height="34" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="552.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Hardware / firmware</text><text x="269" y="552.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Tidak diuji, tidak di-flash, dan tidak dijadikan bukti hasil operasi oleh diagram ini.</text><rect x="40" y="568" width="1120" height="34" rx="0" fill="white" stroke="white"/><text x="49" y="586.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Komponen pasif</text><text x="269" y="586.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Dirangkum per fungsi; seluruh nilai, pin, dan net tersedia pada lampiran CSV/JSON.</text><rect x="40" y="635" width="540" height="100" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="635" width="5" height="100" rx="2" fill="#147B75" stroke="#147B75"/><text x="56" y="661.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Lampiran yang dapat diedit</text><text x="56" y="684.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">01...10-diagram.svg: vector per halaman</text><text x="56" y="701.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">index.html: penampil offline dengan zoom</text><text x="56" y="718.4399999999999" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">build_diagram.py: sumber generator PDF/SVG</text><rect x="620" y="635" width="540" height="100" rx="8" fill="white" stroke="#CCD7DE"/><rect x="620" y="635" width="5" height="100" rx="2" fill="#147B75" stroke="#147B75"/><text x="636" y="661.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Lampiran jejak bukti</text><text x="636" y="684.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">source-net-evidence.json: pin/net dan label schematic</text><text x="636" y="701.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">component-pins.csv: seluruh komponen/pin motherboard</text><text x="636" y="718.4399999999999" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">README.md: cara pakai, regenerasi, dan batas cakupan</text><text x="38" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#5D7180">Sumber: source-GLD2.zip | Sheet_1 + net PCB; modul sensor: gambar referensi terpisah.</text><text x="1000" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#5D7180">09 Sep 2026   |   10 / 10</text></svg>