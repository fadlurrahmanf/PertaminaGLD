er</text><text x="56" y="601.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Ke semua header sensor</text><rect x="405" y="535" width="340" height="145" rx="8" fill="white" stroke="#CCD7DE"/><rect x="405" y="535" width="5" height="145" rx="2" fill="#316FC0" stroke="#316FC0"/><text x="421" y="561.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Clock dan kontrol</text><text x="421" y="584.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Clock 8 MHz</text><text x="421" y="601.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Pull-up power-down dan reset</text><rect x="805" y="535" width="355" height="145" rx="8" fill="white" stroke="#CCD7DE"/><rect x="805" y="535" width="5" height="145" rx="2" fill="#AD4D35" stroke="#AD4D35"/><text x="821" y="561.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Sumber +5VA belum terlihat</text><text x="821" y="584.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Net +5VA hanya terhubung ke</text><text x="821" y="601.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">beban analog dan decoupling.</text><text x="821" y="618.4399999999999" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Tidak ditemukan komponen/wire</text><text x="821" y="635.2399999999999" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">penghubung +5V ke +5VA</text><text x="821" y="652.0399999999998" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">pada motherboard dalam arsip.</text><text x="38" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#5D7180">Sumber: source-GLD2.zip | Sheet_1 + net PCB; modul sensor: gambar referensi terpisah.</text><text x="1000" y="773.2" font-family="Arial,sans-serif" font-size="10" font-we