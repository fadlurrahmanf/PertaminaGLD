<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLD2 - Diagram Blok</title><style>body{margin:0;background:#dfe7ed;color:#183044;font:15px Arial}header{position:sticky;top:0;background:#183044;color:white;padding:16px 24px;z-index:2;display:flex;gap:20px;align-items:center;flex-wrap:wrap}header a{color:#9ee6dd}main{padding:20px;overflow:auto}.page{width:1200px;max-width:none;margin:0 auto 24px;background:white;box-shadow:0 4px 16px #18304424}.page img{width:100%;display:block}select,button{padding:6px}input{vertical-align:middle}nav{display:flex;gap:12px}p{margin:0}@media print{header{display:none}.page{break-after:page;margin:0;width:100%;box-shadow:none}main{padding:0}}</style><header><b>GLD2 | Diagram Blok Schematic</b><select id="jump"><option value="p1">01 - Arsitektur</option><option value="p2">02 - Daya utama</option><option value="p3">03 - Always On</option><option value="p4">04 - Modul sensor</option><option value="p5">05 - Akuisisi analog</option><option value="p6">06 - I2C & sensor</option><option value="p7">07 - Koneksi ESP32</option><option value="p8">08 - Alarm & status</option><option value="p9">09 - Hub ESP32</option><option value="p10">10 - Ringkasan</option></select><label>Zoom <input id="zoom" type="range" min="60" max="180" value="100"> <span id="zval">100%</span></label><nav><a href="../../pdf/GLD2-Block-Diagram.pdf">PDF</a><a href="component-pins.csv">Seluruh pin (CSV)</a><a href="README.md">Panduan</a></nav></header><main><section class="page" id="p1"><img src="01-diagram.svg" alt="Diagram 1: Arsitektur"></section><section class="page" id="p2"><img src="02-diagram.svg" alt="Diagram 2: Daya utama"></section><section class="page" id="p3"><img src="03-diagram.svg" alt="Diagram 3: Always On"></section><section class="page" id="p4"><img src="04-diagram.svg" alt="Diagram 4: Modul sensor"></section><section class="page" id="p5"><img src="05-diagram.svg" alt="Diagram 5: Akuisisi analog"></section><section class="page" id="p6"><img src="06-diagram.svg" alt="Diagram 6: I2C &amp; sensor"></section><section class="page" id="p7"><img src="07-diagram.svg" alt="Diagram 7: Koneksi ESP32"></section><section class="page" id="p8"><img src="08-diagram.svg" alt="Diagram 8: Alarm &amp; status"></section><section class="page" id="p9"><img src="09-diagram.svg" alt="Diagram 9: Hub ESP32"></section><section class="page" id="p10"><img src="10-diagram.svg" alt="Diagram 10: Ringkasan"></section></main><script>const z=document.querySelector('#zoom');z.oninput=()=>{document.querySelectorAll('.page').forEach(p=>p.style.width=(12*z.value)+'px');document.querySelector('#zval').textContent=z.value+'%'};document.querySelector('#jump').onchange=e=>document.getElementById(e.target.value).scrollIntoView({behavior:'smooth',block:'center'});</script></html>
