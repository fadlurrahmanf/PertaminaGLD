30" width="420" height="130" rx="8" fill="white" stroke="#CCD7DE"/><rect x="740" y="330" width="5" height="130" rx="2" fill="#8060AC" stroke="#8060AC"/><text x="756" y="356.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Latch daya</text><text x="756" y="379.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">PRE dan CLR mengatur ENA</text><text x="756" y="396.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">ENA mengaktifkan baterai</text><text x="756" y="413.44" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">dan boost 5 V</text><polyline points="300,390 390,390" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="390,390 382.79642318117857,393.4797242728898 382.79642318117857,386.5202757271102" fill="#8060AC"/><rect x="318" y="366" width="38.39306640625" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="321" y="377.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#8060AC">WAKE</text><polyline points="650,390 740,390" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="740,390 732.7964231811786,393.4797242728898 732.7964231811786,386.5202757271102" fill="#8060AC"/><rect x="669" y="366" width="28.61767578125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="672" y="377.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#8060AC">PRE</text><rect x="40" y="535" width="365" height="160" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="535" width="5" height="160" rx="2" fill="#8060AC" stroke="#8060AC"/><text x="56" y="561.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">ESP32 dan reset</text><text x="56" y="584.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">GPIO17: DONE</text><text x="56" y="601.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">GPIO16: CLR</text><text x="56" y="618.4399999999999" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Reset bersama USB dan watchdog</text><rect x="465" y="535" width="330" height="160" rx="8" fill="white" stroke="#CCD7DE"/><rect x="465" y="535" width="5" height="160" rx="2" fill="#8060AC" stroke="#8060AC"/><text x="481" y="561.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Waktu watchdog</text><text x="481" y="584.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Jaringan resistor mengatur</text><text x="481" y="601.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">waktu reset</text><rect x="855" y="535" width="305" height="160" rx="8" fill="white" stroke="#CCD7DE"/><rect x="855" y="535" width="5" height="160" rx="2" fill="#B86518" stroke="#B86518"/><text x="871" y="561.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Supervisi daya</text><text x="871" y="584.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Memantau 3V3AON</text><text x="871" y="601.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">ENA mengendalikan</text><text x="871" y="618.4399999999999" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">baterai dan boost</text><text x="38" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#5D7180">Sumber: source-GLD2.zip | Sheet_1 + net PCB; modul sensor: gambar referensi terpisah.</text><text x="1000" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#5D7180">09 Sep 2026   |   03 / 10</text></svg>