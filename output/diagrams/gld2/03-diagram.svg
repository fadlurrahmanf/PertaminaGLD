<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">03  Always On, watchdog, and latch</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Purpose: keep supervision and wake control available when the main switched circuitry is off.</text><rect x="40" y="150" width="255" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="150" width="5" height="110" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="176.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Always On sources</text><text x="56" y="199.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Buck or battery</text><text x="56" y="216.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">24 V case: buck supplies AON</text><rect x="455" y="150" width="260" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="455" y="150" width="5" height="110" rx="2" fill="#B86518" stroke="#B86518"/><text x="471" y="176.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Diode OR + regulator</text><text x="471" y="199.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">TPS7A0233</text><text x="471" y="216.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">3.3 V output</text><rect x="875" y="150" width="285" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="875" y="150" width="5" height="110" rx="2" fill="#B86518" stroke="#B86518"/><text x="891" y="176.3