<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">13  Analog, AON, and module IC references</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">No-load IC figures do not include pull-ups, output loads, resistor networks or conversion losses.</text><rect x="40" y="135" width="1120" height="37" rx="3" fill="#183044" stroke="#183044"/><text x="49" y="153.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="white">Device / condition</text><text x="464" y="153.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="white">Current reference</text><text x="729" y="153.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="white">Power / calculation</text><text x="1064" y="153.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="white">Source</text><rect x="40" y="172" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="190.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">ADS AVDD at 5 V, PGA1, buffer off</text><text x="464" y="190.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">7 / 10 mA</text><text x="729" y="190.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">35 / 50 mW (typ / max)</text><text x="1064" y="190.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S07</text><rect x="40" y="209" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="227.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">ADS DVDD at 3.3 V, CLKOUT off</text><text x="464" y="227.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">0.9 / 2 mA</text><text x="729" y="227.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">2.97 / 6.6 mW (typ / max)</text><text x="1064" y="227.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S07</text><rect x="40" y="246" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="264.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">OPA320, each, no load at 5.5 V</text><text x="464" y="264.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">1.5 / 1.75 mA</text><text x="729" y="264.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">8.25 / 9.625 mW at 5.5 V, 25°C</text><text x="1064" y="264.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S08</text><rect x="40" y="283" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="301.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">ADR03, no load at 5 V</text><text x="464" y="301.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">0.65 / 1 mA</text><text x="729" y="301.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">3.25 / 5 mW (typ / max)</text><text x="1064" y="301.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S09</text><rect x="40" y="320" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="338.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">VMID divider at VA = 5 V</text><text x="464" y="338.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">5 / 20k = 250 µA</text><text x="729" y="338.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">1.25 mW</text><text x="1064" y="338.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Schematic</text><rect x="40" y="357" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="375.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">TPL5010, normal operation</text><text x="464" y="375.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">35 / 50 nA</text><text x="729" y="375.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">0.1155 / 0.165 µW at 3.3 V</text><text x="1064" y="375.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S16</text><rect x="40" y="394" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="412.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">SN74AUP1G74, static, up to 85°C</text><text x="464" y="412.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">0.5 µA max</text><text x="729" y="412.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">1.65 µW at 3.3 V</text><text x="1064" y="412.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S17</text><rect x="40" y="431" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="449.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">SN74LVC1G06, static</text><text x="464" y="449.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">10 µA max</text><text x="729" y="449.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">33 µW at 3.3 V</text><text x="1064" y="449.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S18</text><rect x="40" y="468" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="486.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">TPS3839, no output load</text><text x="464" y="486.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">150 / 500 nA</text><text x="729" y="486.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">0.495 / 1.65 µW at 3.3 V</text><text x="1064" y="486.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S19</text><rect x="40" y="505" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="523.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Module: INA333 + MCP4725 + XBLW buffer</text><text x="464" y="523.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">50 + 210 + 100 = 360 µA typ</text><text x="729" y="523.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IC benchmark only; + other loads</text><text x="1064" y="523.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S28–S31</text><rect x="40" y="542" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="560.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Module switch TPS22919</text><text x="464" y="560.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">8 µA typ at 3.6 V</text><text x="729" y="560.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">28.8 µW at 3.6 V; + I² × RON</text><text x="1064" y="560.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">S30</text><text x="40" y="610.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">ADS figures use the datasheet’s 7.68 MHz clock. The schematic has an 8 MHz crystal: these are reference cases, not guaranteed board maxima. Higher PGA/buffer settings increase analog</text><text x="40" y="628.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">current. Sum at the stated low-power case: 37.97 mW typ, 56.60 mW from table maxima.</text><text x="40" y="682.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Module benchmark conditions: INA333 at midsupply/no output load; MCP4725 code 000h, digital inputs grounded/no load; XBLW LM321DTR at 5 V/no load. The switch’s 3.6 V figure is not a</text><text x="40" y="700.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">measured 5 V total. VMID and VREF output currents must be added to their buffers.</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">13 / 17</text></svg>