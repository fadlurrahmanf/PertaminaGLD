7.79642318117857,610.4797242728898 397.79642318117857,603.5202757271102" fill="#147B75"/><rect x="347" y="583" width="33.5" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="350" y="594.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#147B75">VMID</text><polyline points="680,410 745,410 745,605 805,605" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="805,605 797.7964231811786,608.4797242728898 797.7964231811786,601.5202757271102" fill="#B86518"/><rect x="694" y="451" width="33.21533203125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="697" y="462.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#B86518">+5VA</text><polyline points="982,535 1175,535 1175,195 1160,195" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="1160,195 1167.2035768188214,191.52027572711015 1167.2035768188214,198.47972427288985" fill="#B86518"/><rect x="1089" y="513" width="64.07763671875" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="1092" y="524.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#B86518">ADC supply</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">05 / 9</text></svg>