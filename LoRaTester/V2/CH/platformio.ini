[platformio]
default_envs = lt_ch1, lt_ch2
src_dir = src

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_extra_dirs = ../../../firmware/lib
lib_ldf_mode = deep+
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../../../firmware/ch/include
    -I../../../firmware/shared/include
    -I../shared/include

[env:lt_ch1]
build_flags = ${env.build_flags} -DLT_ROLE=1

[env:lt_ch1_altmac]
build_flags = ${env.build_flags} -DLT_ROLE=1 -DLT_TEMP_ALT_MAC=1

[env:lt_ch2]
build_flags = ${env.build_flags} -DLT_ROLE=2
