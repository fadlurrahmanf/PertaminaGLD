 x="56" y="692.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Module allocation</text><text x="56" y="715.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">INA333: 0.050 mA; local divider: about 0.246 mA; one ADC-input allowance is shared across eight modules.</text><text x="56" y="732.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Header current also includes switch bias. Sensor sensing current is supplied by motherboard VMID (page 05).</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">04 / 09</text></svg>