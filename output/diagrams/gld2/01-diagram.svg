<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">01  System architecture</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Power, sensor acquisition, control, and communications in one device.</text><rect x="40" y="135" width="250" height="140" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="135" width="5" height="140" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="161.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Power inputs</text><text x="56" y="185.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">External 24 V</text><text x="56" y="203.85999999999999" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Battery</text><text x="56" y="222.05999999999997" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">External 5 V</text><rect x="365" y="135" width="365" height="140" rx="8" fill="white" stroke="#CCD7DE"/><rect x="365" y="135" width="5" height="140" rx="2" fill="#B86518" stroke="#B86518"/><text x="381" y="161.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Power distribution</text><text x="381" y="185.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">+5 V | Analog +5VA</text><text x="381" y="203.85999999999999" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">3.3 V | Always On</text><text x="381" y="222.05999999999997" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#1