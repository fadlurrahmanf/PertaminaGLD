t><text x="481" y="478.44" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">(PCF8574, TPS22964)</text><polyline points="605,250 605,395" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="605,395 601.5202757271102,387.79642318117857 608.4797242728898,387.79642318117857" fill="#8060AC"/><rect x="622" y="303" width="39.01611328125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="625" y="314.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#8060AC">control</text><rect x="865" y="395" width="230" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="865" y="395" width="5" height="115" rx="2" fill="#B86518" stroke="#B86518"/><text x="881" y="421.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Eight modules</text><text x="881" y="444.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Enable per module</text><text x="881" y="461.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Power and analog signals</text><polyline points="745,450 865,450" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="865,450 857.7964231811786,453.4797242728898 857.7964231811786,446.5202757271102" fill="#8060AC"/><rect x="763" y="426" width="56.76220703125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="766" y="437.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#8060AC">8 x enable</text><rect x="80" y="555" width="270" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="80" y="555" width="5" height="115" rx="2" fill="#316FC0" stroke="#316FC0"/><text x="96" y="581.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Temperature and humidity</text><text x="96" y="604.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Connected directly</text><text x="96" y="621.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">to the main I2C bus</text><text x="96" y="638.4399999999999" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">(SHT40)</text><polyline points="215,285 215,555" fill="none" stroke="#316FC0" stroke-width="1.8"/><polygon points="215,555 211.52027572711015,547.7964231811786 218.47972427288985,547.7964231811786" fill="#316FC0"/><rect x="232" y="408" width="23.11767578125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="235" y="419.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#316FC0">I2C</text><rect x="430" y="600" width="680" height="70" rx="8" fill="white" stroke="#CCD7DE"/><rect x="430" y="600" width="5" height="70" rx="2" fill="#147B75" stroke="#147B75"/><text x="446" y="626.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Main function</text><text x="446" y="649.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">I2C selects sensors, sets the DAC reference, enables modules, and reads temperature and humidity.</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">06 / 9</text></svg>