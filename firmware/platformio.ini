[platformio]
description = Pertamina GLD firmware workspace
src_dir = .

; Host-level protocol tests currently run with:
;   python firmware/tests/run_tests.py
;
; Final firmware environments live here.
; Legacy GLD support/debug environments live in:
;   firmware/support/platformio.ini
; Bench-only self-test environments live in:
;   firmware/bench/platformio.ini

[env:gld]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:tools/operator_package_post.py
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_ldf_mode = deep+
lib_deps =
    xreef/PCF8574 library@2.4.0
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DPGL_GLD_BOARD_PROFILE_WROOM_U1_N16R8=1
    -Iconfig
    -Ishared/include
    -Igld/include
    -Igld/models/model_1
build_src_filter =
    +<shared/src/AppFrame.cpp>
    +<shared/src/GldCrypto.cpp>
    +<shared/src/GldPayload.cpp>
    +<shared/src/GldRecord.cpp>
    +<gld/src/GldAds1256Reader.cpp>
    +<gld/src/GldCommandParser.cpp>
    +<gld/src/GldDacMux.cpp>
    +<gld/src/GldFrameBuilder.cpp>
    +<gld/src/GldModeManager.cpp>
    +<gld/src/GldModbusRtu.cpp>
    +<gld/src/GldMovingAverage.cpp>
    +<gld/src/GldModelBinding.cpp>
    +<gld/src/GldNullingService.cpp>
    +<gld/src/GldPcf8574.cpp>
    +<gld/src/GldPower.cpp>
    +<gld/src/GldQcService.cpp>
    +<gld/src/GldThresholdClassifier.cpp>
    +<gld/src/GldUnifiedMain.cpp>
    +<gld/models/model_1/NeuralNetwork.cpp>
    +<gld/models/model_1/model_data.cpp>
    -<gld/src/main.cpp>
    -<gld/src/GldSensorSelfTestMain.cpp>
    -<gld/src/GldNullingSelfTestMain.cpp>
    -<gld/src/GldLoRaTxSelfTestMain.cpp>
    -<gld/src/GldInferenceMain.cpp>
    -<gld/src/GldDatasetMain.cpp>
    -<gld/src/GldNullingRuntimeMain.cpp>
    -<ch/src/>
    -<docs/>
    -<tests/>
    -<versions/>

[env:gld_model_1]
extends = env:gld
build_unflags =
    ${env:gld.build_unflags}
extra_scripts = post:tools/operator_package_post.py

[env:gld_model_2]
extends = env:gld
build_unflags =
    ${env:gld.build_unflags}
    -Igld/models/model_1
build_flags =
    ${env:gld.build_flags}
    -Igld/models/model_2
build_src_filter =
    ${env:gld.build_src_filter}
    -<gld/models/model_1/>
    +<gld/models/model_2/NeuralNetwork.cpp>
    +<gld/models/model_2/model_data.cpp>
extra_scripts = post:tools/operator_package_post.py

[env:gld_model_3]
extends = env:gld
build_unflags =
    ${env:gld.build_unflags}
    -Igld/models/model_1
build_flags =
    ${env:gld.build_flags}
    -Igld/models/model_3
build_src_filter =
    ${env:gld.build_src_filter}
    -<gld/models/model_1/>
    +<gld/models/model_3/NeuralNetwork.cpp>
    +<gld/models/model_3/model_data.cpp>
extra_scripts = post:tools/operator_package_post.py

; GLD2 motherboard profile. This remains an isolated build/package path;
; env:gld keeps the original WROOM-1U board pin map unchanged.
[env:gld_v2]
extends = env:gld
build_unflags =
    ${env:gld.build_unflags}
    -DPGL_GLD_BOARD_PROFILE_WROOM_U1_N16R8=1
build_flags =
    ${env:gld.build_flags}
    -DPGL_GLD_BOARD_PROFILE_GLD2=1
extra_scripts = post:tools/operator_package_post.py

[env:tfbg]
; Field battery test: retain battery framing/power identity, but run the
; continuous 24V scan/TX cadence without the one-shot TPL5010 power-off flow.
extends = env:gld
build_flags =
    ${env:gld.build_flags}
    -DPGL_GLD_TFBG_CONTINUOUS_BATTERY=1

; Bench-only alarm simulation. Keeps the production GLD alarm radio path active,
; but forces the model result to a deterministic alarm for end-to-end routing
; tests without gas exposure.
[env:gldAlarmSim]
extends = env:gld
build_flags =
    ${env:gld.build_flags}
    -DPGL_GLD_SIMULATED_ALARM_MODEL=1
    -DPGL_GLD_SIMULATED_ALARM_GAS_CLASS=2
    -DPGL_GLD_SIMULATED_ALARM_CONFIDENCE=100

; Bench-only normal/clear simulation for pull-route tests while the bundled
; model artifact contract is being updated.
[env:gldClearSim]
extends = env:gld
build_flags =
    ${env:gld.build_flags}
    -DPGL_GLD_SIMULATED_CLEAR_MODEL=1

; Bench-only sensorless variants for radio/path testing when the ADS/MCP
; sensor board is not installed. These keep the production LoRa/AES/frame path
; active, but generate deterministic dummy telemetry without ADS reads.
[env:gldSensorlessAlarmSim]
extends = env:gldAlarmSim
build_flags =
    ${env:gldAlarmSim.build_flags}
    -DPGL_GLD_SENSORLESS_BENCH=1
    -DPGL_GLD_ALLOW_UNAUTHENTICATED_ALARM_ACK=1
    -DGLD_BATTERY_SENSOR_WARMUP_MS=8000
    -DGLD_BATTERY_VALID_SAMPLE_BATCHES=10
    -DGLD_BATTERY_ALARM_TX_ATTEMPTS=8
    -DGLD_BATTERY_ALARM_RETRY_DELAY_MS=1000
    -DGLD_LORA_RX_WINDOW_MS=3000
    -DPGL_GLD_SENSORLESS_REPEAT_INTERVAL_MS=60000

[env:gldSensorlessClearSim]
extends = env:gldClearSim
build_flags =
    ${env:gldClearSim.build_flags}
    -DPGL_GLD_SENSORLESS_BENCH=1
    -DGLD_SCAN_INTERVAL_MS=250
    -DGLD_BATTERY_SENSOR_WARMUP_MS=4000
    -DGLD_BATTERY_VALID_SAMPLE_BATCHES=10
    -DGLD_LORA_RX_WINDOW_MS=3000
    -DPGL_GLD_SENSORLESS_REPEAT_INTERVAL_MS=15000

; Field-test aliases for sensorless range tests. These intentionally avoid the
; normal gld environment name so simulated clear/alarm nodes are easy to audit
; in build logs, packages, and commit history.
[env:gldFieldtestSensorlessAlarm]
extends = env:gldSensorlessAlarmSim
build_flags =
    ${env:gldSensorlessAlarmSim.build_flags}
    -DPGL_GLD_FIELDTEST_SELFTEST_BUILD=1
    -DPGL_GLD_SENSORLESS_FIELD_TEST_BUILD=1

[env:gldFieldtestSensorlessClear]
extends = env:gldSensorlessClearSim
build_flags =
    ${env:gldSensorlessClearSim.build_flags}
    -DPGL_GLD_FIELDTEST_SELFTEST_BUILD=1
    -DPGL_GLD_SENSORLESS_FIELD_TEST_BUILD=1

; Isolated field test for the legacy 8-input/4-output placeholder model. This
; environment keeps a battery-powered board awake with the continuous scan/TX
; cadence, rather than issuing the one-shot TPL5010 DONE -> CLR power-off.
; It is non-production: authenticated non-alarm telemetry may be sent, but
; alarm radio frames and physical alarm outputs are suppressed, and non-clear
; classes are reported as unverified.
[env:gldFieldtest]
extends = env:gld
build_flags =
    ${env:gld.build_flags}
    -DPGL_GLD_TFBG_CONTINUOUS_BATTERY=1
    -DPGL_GLD_FIELDTEST_4CLASS=1
    -DPGL_GLD_FIELDTEST_SELFTEST_BUILD=1
    -DGLD_ALLOW_SELFTEST_AES_FALLBACK=1

; TPL5010 power-cycle smoke test. Inherits the GLD board/toolchain settings
; but replaces the normal unified firmware entry point with the test main.
[env:gld_tpl5010_powercycle_test]
extends = env:gld
build_src_filter =
    ${env:gld.build_src_filter}
    -<gld/src/GldUnifiedMain.cpp>
    +<gld/src/GldTpl5010PowerCycleTestMain.cpp>

; Bench-only MQ8 experiment: direct GPIO42 HIGH for 125 ms then LOW for
; 875 ms, with a separate CFG manual override. No LoRa, MQTT, alarm, or
; production flow runs.
[env:gld_mq8_cycle]
extends = env:gld
build_src_filter =
    ${env:gld.build_src_filter}
    -<gld/src/GldUnifiedMain.cpp>
    +<gld/src/GldMq8HeaterDutyCycleMain.cpp>

; Isolated Arduino Uno test on COM5: D8 MOSFET duty configured over 115200
; serial using `ONms,OFFms`, e.g. `125,875`; starts safe at `0,1000` (OFF).
[env:uno_io8_duty_125_875]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM5
upload_speed = 115200
build_src_filter =
    +<uno/src/UnoIo8DutyCycleMain.cpp>
    -<gld/src/>
    -<ch/src/>
    -<gateway/src/>
    -<shared/src/>

; CNN real-time inference runtime (integration guide TAHAP 1-20). Isolated
; from env:gld — no LoRa/AES frame TX, MQTT-only dashboard hookup. See
; firmware/gld/src/GldCnnRuntimeMain.cpp and firmware/gld/include/cnn_inference.h.
[env:gld_cnn]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:tools/operator_package_post.py
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_ldf_mode = deep+
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DPGL_GLD_BOARD_PROFILE_WROOM_U1_N16R8=1
    -Iconfig
    -Ishared/include
    -Igld/include
    -Igld/models/model_1
build_src_filter =
    +<gld/src/GldAds1256Reader.cpp>
    +<gld/src/GldMovingAverage.cpp>
    +<gld/src/GldPower.cpp>
    +<gld/src/GldCnnRuntimeMain.cpp>
    +<gld/src/cnn_inference.cpp>
    +<gld/models/model_1/NeuralNetwork.cpp>
    +<gld/models/model_1/model_data.cpp>
    -<gld/src/main.cpp>
    -<gld/src/GldSensorSelfTestMain.cpp>
    -<gld/src/GldNullingSelfTestMain.cpp>
    -<gld/src/GldLoRaTxSelfTestMain.cpp>
    -<gld/src/GldUnifiedMain.cpp>
    -<gld/src/GldInferenceMain.cpp>
    -<gld/src/GldDatasetMain.cpp>
    -<gld/src/GldNullingRuntimeMain.cpp>
    -<ch/src/>
    -<docs/>
    -<tests/>
    -<versions/>

[env:ch]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
extra_scripts = post:tools/operator_package_post.py
lib_ldf_mode = deep+
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Legacy env alias remains mapped to the audited circle (besar) board.
    -DPGL_CH_BOARD_CIRCLE=1
    -DPGL_CH_USE_RF_SWITCH=1
    ; CH E22: TPL5010 WAKE is GPIO21; DONE is GPIO47. Keep the board powered
    ; during continuous operation by periodically pulsing the actual DONE net.
    -DPGL_CH_USE_EXTERNAL_WDT_KEEPALIVE=1
    -DPGL_CH_BOOT_SETTLE_MS=12000
    -DPGL_CH_USE_REFERENCE_RADIO_RESET=1
    -DPGL_CH_RADIO_INIT_RETRY_MS=7000
    -DPGL_CH_EXTERNAL_WDT_KEEPALIVE_INTERVAL_MS=10000
    ; Keep battery telemetry, but do not gate CH start, run, or recovery on it.
    -DPGL_CH_VBAT_READ_ONLY=1
    -Iconfig
    -Ishared/include
    -Ich/include
build_src_filter =
    +<shared/src/AppFrame.cpp>
    +<shared/src/FirmwareConfig.cpp>
    +<shared/src/GldRecord.cpp>
    +<ch/src/AlarmQueue.cpp>
    +<ch/src/ChCommandParser.cpp>
    +<ch/src/ChPullRequest.cpp>
    +<ch/src/ChRuntime.cpp>
    +<ch/src/ChTxQueue.cpp>
    +<ch/src/ChUplink.cpp>
    +<ch/src/ClusterResponse.cpp>
    +<ch/src/NodeCache.cpp>
    +<ch/src/ChStarMeshRuntimeMain.cpp>
    -<gld/src/>
    -<ch/src/ChStarRxSelfTestMain.cpp>
    -<docs/>
    -<tests/>
    -<versions/>

[env:chFieldtest]
extends = env:ch
build_flags =
    ${env:ch.build_flags}
    -DPGL_CH_FIELD_HELLO_INTERVAL_MS=30000
    -DPGL_CH_FIELD_HELLO_JITTER_MS=5000
    -DPGL_CH_PARENT_HEALTH_TIMEOUT_MS=180000
    -DPGL_CH_ROUTE_VERIFY_INTERVAL_MS=60000
    -DPGL_CH_ROUTE_VERIFY_JITTER_MS=30000
    -DPGL_CH_ROUTE_VERIFY_WINDOW_MS=12000
    -DPGL_CH_PARENT_MIN_DWELL_MS=90000
    -DPGL_CH_PARENT_SWITCH_MARGIN_DB=8
    -DPGL_CH_PARENT_SCORE_RSSI_WEIGHT=4
    -DPGL_CH_PARENT_SCORE_SNR_WEIGHT=3
    -DPGL_CH_PARENT_SCORE_DEPTH_PENALTY=6
    -DPGL_CH_FIELD_TEST_BUILD=1

; Product packages selected explicitly by physical PCB shape in Operator Hub.
[env:ch_large]
extends = env:ch

[env:ch_small]
extends = env:ch
build_flags =
    ${env:ch.build_flags}
    -UPGL_CH_BOARD_CIRCLE
    -DPGL_CH_BOARD_RECTANGLE=1

[env:gw_hello_ack_fieldtest]
extends = env:gw
build_flags =
    ${env:gw.build_flags}
    -DPGL_GW_FIELD_TEST_BUILD=1
    -DPGL_GW_CONFIG_RESPONSE_REPEAT_COUNT=5
    -DPGL_GW_CONFIG_RESPONSE_INITIAL_DELAY_MS=220
    -DPGL_GW_CONFIG_RESPONSE_REPEAT_GAP_MS=260
    -DPGL_GW_CONFIG_RESPONSE_REVERSE_RSSI_FLOOR_DBM=-99
    -DPGL_GW_CONFIG_RESPONSE_MIN_REPLY_RSSI_DBM=-112
    -DPGL_GW_CONFIG_RESPONSE_MIN_REPLY_SNR_DB=-6
    -DPGL_GW_PULL_REQUEST_REPEAT_COUNT=3
    -DPGL_GW_PULL_REQUEST_REPEAT_GAP_MS=1800

[env:gw]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
extra_scripts = post:tools/operator_package_post.py
lib_ldf_mode = deep+
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Legacy env alias remains mapped to the audited rectangle (kecil) board.
    -DPGL_GW_BOARD_RECTANGLE=1
    -Iconfig
    -Ishared/include
    -Igateway/include
build_src_filter =
    +<shared/src/AppFrame.cpp>
    +<gateway/src/GatewayMqttMeshMain.cpp>
    -<gld/src/>
    -<ch/src/>
    -<docs/>
    -<tests/>
    -<versions/>

; Product packages selected explicitly by physical PCB shape and MQTT
; transport in Operator Hub. TLS is additive and never replaces non-TLS.
[env:gw_small]
extends = env:gw

[env:gw_large]
extends = env:gw
build_flags =
    ${env:gw.build_flags}
    -UPGL_GW_BOARD_RECTANGLE
    -DPGL_GW_BOARD_CIRCLE=1

[env:gw_small_tls]
extends = env:gw_small
build_flags =
    ${env:gw_small.build_flags}
    -DPGL_GW_MQTT_TLS=1

[env:gw_large_tls]
extends = env:gw_large
build_flags =
    ${env:gw_large.build_flags}
    -DPGL_GW_MQTT_TLS=1
