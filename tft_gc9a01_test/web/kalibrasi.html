<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kalibrasi TFT</title><style>body{font:16px system-ui;max-width:620px;margin:30px auto;padding:0 20px;background:#111827;color:#fff}button,input{font:inherit}button{padding:12px;margin:5px;border:0;border-radius:8px;cursor:pointer}label{display:block;margin:18px 0}input[type=range]{width:100%}canvas{background:#000;border-radius:50%;display:block;margin:20px auto;max-width:100%}.muted{color:#bac7dc}</style><h1>Kalibrasi lingkaran TFT</h1><p class="muted">Atur lingkaran mengikuti lubang casing. Titik merah menunjukkan pusat.</p><button id="connect">Hubungkan ESP32</button><span id="status">Belum terhubung</span><canvas id="preview" width="240" height="240"></canvas><div id="controls"></div><button id="reset">Tengah awal</button><button id="buttonTest">Tes tombol 2</button><script>
const controls=document.querySelector('#controls'),canvas=document.querySelector('#preview'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let port=null,writer=null,timer=null;const defs=[['x','Posisi X',0,239,123],['y','Posisi Y',0,239,120],['r','Jari-jari',1,120,116]];for(const [id,label,min,max,val] of defs){const l=document.createElement('label');l.innerHTML=`${label}: <b id="${id}v">${val}</b><input id="${id}" type="range" min="${min}" max="${max}" value="${val}">`;controls.append(l);l.querySelector('input').oninput=()=>{draw();queue()}}function values(){return defs.map(([id])=>Number(document.getElementById(id).value))}function draw(){const [x,y,r]=values();defs.forEach(([id],i)=>document.getElementById(id+'v').textContent=[x,y,r][i]);ctx.fillStyle='black';ctx.fillRect(0,0,240,240);ctx.strokeStyle='white';ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.stroke();ctx.strokeStyle='red';ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+8,y);ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.stroke()}async function send(s){if(writer)try{await writer.write(new TextEncoder().encode(s+'\n'))}catch(e){status.textContent='Gagal: '+e.message}}function queue(){clearTimeout(timer);timer=setTimeout(()=>send('CIRCLE '+values().join(' ')),100)}document.querySelector('#connect').onclick=async()=>{try{if(!('serial' in navigator))throw Error('Gunakan Chrome atau Edge');port=await navigator.serial.requestPort();await port.open({baudRate:115200});writer=port.writable.getWriter();status.textContent='Terhubung';await new Promise(r=>setTimeout(r,1500));queue()}catch(e){status.textContent=e.message}};document.querySelector('#reset').onclick=()=>{defs.forEach(([id,,,,v])=>document.getElementById(id).value=v);draw();queue()};document.querySelector('#buttonTest').onclick=()=>send('BUTTON');draw();</script></html>
