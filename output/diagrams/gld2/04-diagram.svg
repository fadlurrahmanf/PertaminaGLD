<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">04  Sensor module: functional path</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Each module receives power, I2C, enable, and provides one analog output.</text><rect x="40" y="135" width="1120" height="520" rx="12" fill="#EAF2F2" stroke="#147B75"/><text x="60" y="161.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#147B75">REFERENCE SENSOR MODULE BOUNDARY - functional diagram, not a direct installation pinout</text><rect x="65" y="205" width="260" height="100" rx="8" fill="white" stroke="#CCD7DE"/><rect x="65" y="205" width="5" height="100" rx="2" fill="#B86518" stroke="#B86518"/><text x="81" y="231.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Power input and enable</text><text x="81" y="254.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">+5VIN / GND / EN</text><text x="81" y="271.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">+5VIN switch -&gt; +5V</text><rect x="410" y="205" width="295" height="100" rx="8" fill="white" stroke="#CCD7DE"/><rect x="410" y="205" width="5" height="100" rx="2" fill="#B86518" stroke="#B86518"/><text x="426" y="231.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Module power filter</text><text x="426" y="254.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">+5V -&gt; local +5VA</text><text x="426" y="271.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">For analog circuitry</text><rect x="800" y="205" width="330" height="100" rx="8" fill="white" stroke="#CCD7DE"/><rect x="800" y="205" width="5" height="100" rx="2" fill="#B86518" stroke="#B86518"/><text x="816" y="231.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Local distribution</text><text x="816" y="254.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">+5V for sensor heater</text><text x="816" y="271.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">+5VA for analog circuitry</text><text x="816" y="288.44" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Separate from motherboard +5VA net</text><polyline points="325,255 410,255" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="410,255 402.79642318117857,258.4797242728898 402.79642318117857,251.52027572711015" fill="#B86518"/><polyline points="705,255 800,255" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="800,255 792.7964231811786,258.4797242728898 792.7964231811786,251.52027572711015" fill="#B86518"/><rect x="65" y="365" width="255" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="65" y="365" width="5" height="110" rx="2" fill="#147B75" stroke="#147B75"/><text x="81" y="391.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Sensor slot 1 (example)</text><text x="81" y="414.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Sensor element + R/C network</text><text x="81" y="431.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">VMID_REF reference input</text><text x="81" y="448.44" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Two inputs to amplifier</text><rect x="435" y="365" width="285" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="435" y="365" width="5" height="110" rx="2" fill="#147B75" stroke="#147B75"/><text x="451" y="391.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Analog amplifier</text><text x="451" y="414.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">VIN+ / VIN- inputs</text><text x="451" y="431.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">REF from buffer</text><rect x="840" y="365" width="290" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="840" y="365" width="5" height="110" rx="2" fill="#147B75" stroke="#147B75"/><text x="856" y="391.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Module ANOUT</text><text x="856" y="414.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">To one ADS channel</text><text x="856" y="431.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">then read by ESP32</text><polyline points="320,420 435,420" fill="none" stroke="#147B75" stroke-width="1.8"/><polygon points="435,420 427.79642318117857,423.4797242728898 427.79642318117857,416.5202757271102" fill="#147B75"/><rect x="328" y="396" width="61.92919921875" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="331" y="407.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#147B75">VIN+ / VIN-</text><polyline points="720,420 840,420" fill="none" stroke="#147B75" stroke-width="1.8"/><polygon points="840,420 832.7964231811786,423.4797242728898 832.7964231811786,416.5202757271102" fill="#147B75"/><rect x="744" y="396" width="44.5" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="747" y="407.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#147B75">ANOUT</text><rect x="65" y="530" width="255" height="95" rx="8" fill="white" stroke="#CCD7DE"/><rect x="65" y="530" width="5" height="95" rx="2" fill="#316FC0" stroke="#316FC0"/><text x="81" y="556.3" font-fam