<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">14  Rail currents and complete budget equations</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">All I symbols are in amperes, P in watts. η is actual efficiency at the operating point; no efficiency is invented.</text><rect x="40" y="135" width="1120" height="33" rx="3" fill="#183044" stroke="#183044"/><text x="49" y="153.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="white">Power path / symbol</text><text x="369" y="153.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="white">Current / power equation or included load</text><rect x="40" y="168" width="1120" height="33" rx="0" fill="white" stroke="white"/><text x="49" y="186.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">VCC: I33; P33 = 3.3 × I33</text><text x="369" y="186.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IESP + ILORA + IADSD + ISHT + IPCF + IRS485 + IUSB + IPULL/LED</text><rect x="40" y="201" width="1120" height="33" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="219.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">VCC converter input: I33IN</text><text x="369" y="219.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">P33 / (V5 × η33). η33 includes converter losses; do not add IQ twice.</text><rect x="40" y="234" width="1120" height="33" rx="0" fill="white" stroke="white"/><text x="49" y="252.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Module: IM; all modules: I8</text><text x="369" y="252.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IM = IH + IMA + IQSW; I8 = sum of eight IM, including off-state leakage.</text><rect x="40" y="267" width="1120" height="33" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="285.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Local module analog: IMA</text><text x="369" y="285.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IDAC + IINA + IBUFFER + local passive/output loads. VMID-sourced ISENSE is excluded.</text><rect x="40" y="300" width="1120" height="33" rx="0" fill="white" stroke="white"/><text x="49" y="318.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Motherboard analog: IANA</text><text x="369" y="318.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IADSA + IREFSUP + IMIDSUP; add capacitor charging/leakage for transients.</text><rect x="40" y="333" width="1120" height="33" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="351.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IREFSUP / IMIDSUP</text><text x="369" y="351.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">ADR03 + reference OPA/load / VMID OPA + sensing/reference loads + VA / 20k.</text><rect x="40" y="366" width="1120" height="33" rx="0" fill="white" stroke="white"/><text x="49" y="384.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Main rail: I5; P5 = V5 × I5</text><text x="369" y="384.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">I8 + IANA + I33IN + ITCA + I5PULL + leakage; no upstream regulator double count.</text><rect x="40" y="399" width="1120" height="33" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="417.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Selector paths: IK / IX / IE5</text><text x="369" y="417.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Source share of I5 + applicable bias/leakage current. Conduction loss is a power term.</text><rect x="40" y="432" width="1120" height="33" rx="0" fill="white" stroke="white"/><text x="49" y="450.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Battery boost input: IB5</text><text x="369" y="450.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Boost output power / (VB × ηB5); output includes IX and feedback/control loads.</text><rect x="40" y="465" width="1120" height="33" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="483.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Shared bus: I24EXT + I24BOOST</text><text x="369" y="483.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IAL + IKIN + I24PAR. Alarm branch PALBR = VA24 × IAL, including switch loss.</text><rect x="40" y="498" width="1120" height="33" rx="0" fill="white" stroke="white"/><text x="49" y="516.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">24 V boost input: IB24</text><text x="369" y="516.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">P24OUT / (VB × ηB24); include I24BOOST, diode loss and feedback load.</text><rect x="40" y="531" width="1120" height="33" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="549.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Switched battery: IBSW</text><text x="369" y="549.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IB5 + IB24 + other switched-VBAT leakage.</text><rect x="40" y="564" width="1120" height="33" rx="0" fill="white" stroke="white"/><text x="49" y="582.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">Battery source: IB at 4.2 V</text><text x="369" y="582.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IBSW + switch ground current + 14 µA monitor + battery share of IAIN.</text><rect x="40" y="597" width="1120" height="33" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="615.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">External 24 V input: I24</text><text x="369" y="615.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">I24EXT + input leakage; IKIN = PK / (V24P × ηK). Series loss changes voltage/power.</text><rect x="40" y="630" width="1120" height="33" rx="0" fill="white" stroke="white"/><text x="49" y="648.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">External 5 V input: IE</text><text x="369" y="648.43" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#183044">IE5 + external-5V share of IAIN; diode losses set the downstream voltage.</text><text x="40" y="688.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">IA = IWD + IINV + ILATCH + ISUP + AON pull-ups/switching; IAIN = IA + LDO ground current IG. PK includes selector demand, buck-fed AON, feedback and PR1 divider loads. I24PAR includes other</text><text x="40" y="705.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">shared-rail leakage. Set disabled-converter terms to their off-state leakage, not an assumed active load.</text><text x="40" y="734.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#183044">VM = module switched +5V; VMA = local analog rail; VA = motherboard analog rail. VD = diode drop. VSW(on) = low-side switch drop; alarm load power = (VA24 − VSW) × IAL.</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">14 / 17</text></svg>