ill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="453.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">8  MQ2</text><text x="199" y="453.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Winsen</text><text x="354" y="453.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">30 ± 3</text><text x="499" y="453.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">166.67</text><text x="684" y="453.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">0.8333</text><text x="854" y="453.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">185.19</text><text x="1059" y="453.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">S27</text><rect x="40" y="504" width="540" height="130" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="504" width="5" height="130" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="530.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">All eight enabled at exactly 5.000 V</text><text x="56" y="555.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#183044">I = Σ(5 / RH) = 1.31494 A</text><text x="56" y="575.08" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#183044">P = Σ(25 / RH) = 6.57468 W</text><text x="56" y="594.6800000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#183044">At minimum RH: 1.44491 A (same 5 V).</text><rect x="610" y="504" width="550" height="130" rx="8" fill="white" stroke="#CCD7DE"/><rect x="610" y="504" width="5" height="130" rx="2" fill="#AD4D35" stroke="#AD4D35"/><text x="626" y="530.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Meaning of these numbers</text><text x="626" y="554.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Room-temperature resistance calculation only.</text><text x="626" y="572.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Not a steady-state heater maximum or measured load.</text><text x="626" y="591.0600000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Add sensing paths, analog ICs and conversion losses.</text><text x="40" y="667.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">MQ7: the Hanwei reference specifies 5 V for 60 s and 1.4 V for 90 s. The constant-resistance cycle gives 0.33867 W; that cycle is not present in the supplied fixed-5V module reference. Do not</text><text x="40" y="685.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">use the cycle average as this board’s continuous-5V load.</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">11 / 17</text></svg>