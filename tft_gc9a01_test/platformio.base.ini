[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
lib_deps = bodmer/TFT_eSPI
build_flags =
  -DUSER_SETUP_LOADED=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=13
  -DTFT_SCLK=15
  -DTFT_CS=17
  -DTFT_DC=21
  -DTFT_RST=22
  -DTFT_MISO=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=4000000
