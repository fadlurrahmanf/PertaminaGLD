<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">05  Analog acquisition and voltage reference</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">The analog path has a separate supply filter, voltage reference, VMID, and ADS 8 Channel.</text><rect x="40" y="140" width="250" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="140" width="5" height="115" rx="2" fill="#147B75" stroke="#147B75"/><text x="56" y="166.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Sensor inputs</text><text x="56" y="189.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Eight analog signals</text><text x="56" y="206.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">from sensor modules</text><rect x="370" y="140" width="310" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="370" y="140" width="5" height="115" rx="2" fill="#147B75" stroke="#147B75"/><text x="386" y="166.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Signal filter</text><text x="386" y="189.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#183044">Series resistor and</text><text x="386" y="204.42000000000002" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#183044">capacitor to GND</text><rect x="790" y="140" width="370" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="790" y="140" width="5" height="115" rx="2" fill="#147B75" stroke="#147B75"/><text x="806" y="166.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">ADS 8 Channel</text><text x="806" y="189.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Receives 8 analog</text><text x="806" y="206.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">channels simultaneously</text><text x="806" y="223.44000000000003" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">(ADS1256)</text><polyline points="290,195 370,195" fill="none" stroke="#147B75" stroke-width="1.8"/><polygon points="370,195 362.79642318117857,198.47972427288985 362.79642318117857,191.52027572711015" fill="#147B75"/><rect x="297" y="171" width="70.8291015625" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="300" y="182.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#147B75">analog signal</text><polyline points="680,195 790,195" fill="none" stroke="#147B75" stroke-width="1.8"/><polygon points="790,195 782.7964231811786,198.47972427288985 782.7964231811786,191.52027572711015" fill="#147B75"/><rect x="684" y="171" width="70.81298828125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="687" y="182.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#147B75">filtered signal</text><rect x="40" y="335" width="250" height="120" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="335" width="5" height="120" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="361.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">+5V rail</text><text x="56" y="384.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">System power supply</text><rect x="370" y="335" width="310" height="120" rx="8" fill="white" stroke="#CCD7DE"/><rect x="370" y="335" width="5" height="120" rx="2" fill="#B86518" stroke="#B86518"/><text x="386" y="361.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Analog +5VA filter</text><text x="386" y="384.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Ferrite and capacitors</text><text x="386" y="401.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">isolate analog supply</text><rect x="790" y="335" width="370" height="120" rx="8" fill="white" stroke="#CCD7DE"/><rect x="790" y="335" width="5" height="120" rx="2" fill="#147B75" stroke="#147B75"/><text x="806" y="361.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">ADC reference</text><text x="806" y="384.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Stable reference and</text><text x="806" y="401.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">VREF buffer</text><text x="806" y="418.44" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">(ADR03, OPA320)</text><polyline points="290,395 370,395" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="370,395 362.79642318117857,398.4797242728898 362.79642318117857,391.5202757271102" fill="#B86518"/><rect x="302" y="371" width="25.87841796875" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="305" y="382.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#B86518">+5V</text><polyline points="680,395 790,395" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="790,395 782.7964231811786,398.4797242728898 782.7964231811786,391.5202757271102" fill="#B86518"/><rect x="707" y="371" width="33.21533203125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="710" y="382.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#B86518">+5VA</text><polyline points="975,335 975,285 975,255" fill="none" stroke="#147B75" stroke-width="1.8"/><polygon points="975,255 978.4797242728898,262.20357681882143 971.5202757271102,2