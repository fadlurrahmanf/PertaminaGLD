-serif" font-size="13" font-weight="400" fill="#183044">GPIO: alarm, daya, tombol, LED</text><polyline points="290,400 370,400" fill="none" stroke="#147B75" stroke-width="1.8" stroke-dasharray="5 4"/><polygon points="370,400 362.79642318117857,403.4797242728898 362.79642318117857,396.5202757271102" fill="#147B75"/><rect x="297" y="378" width="45.74072265625" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="300" y="389.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#147B75">AIN0...7</text><polyline points="370,565 325,565 325,510 290,510" fill="none" stroke="#316FC0" stroke-width="1.8" stroke-dasharray="5 4"/><polygon points="290,510 297.20357681882143,506.5202757271102 297.20357681882143,513.4797242728898" fill="#316FC0"/><polyline points="720,400 825,400" fill="none" stroke="#316FC0" stroke-width="1.8"/><polygon points="825,400 817.7964231811786,403.4797242728898 817.7964231811786,396.5202757271102" fill="#316FC0"/><rect x="748" y="378" width="23.72998046875" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="751" y="389.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#316FC0">SPI</text><polyline points="825,545 760,545 760,565 720,565" fill="none" stroke="#316FC0" stroke-width="1.8"/><polygon points="720,565 727.2035768188214,561.5202757271102 727.2035768188214,568.4797242728898" fill="#316FC0"/><rect x="757" y="584" width="23.11767578125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="760" y="595.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#316FC0">I2C</text><polyline points="548,275 548,315 910,315 910,360" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="910,360 906.5202757271102,352.79642318117857 913.4797242728898,352.79642318117857" fill="#B86518"/><rect x="657" y="290" width="60.419921875" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="660" y="301.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#B86518">catu utama</text><polyline points="1030,360 1030,275" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="1030,275 1033.4797242728898,282.20357681882143 1026.5202757271102,282.20357681882143" fill="#8060AC"/><rect x="40" y="660" width="1120" height="74" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="660" width="5" height="74" rx="2" fill="#147B75" stroke="#147B75"/><text x="56" y="686.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Cara membaca</text><text x="56" y="709.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Cokelat: daya. Hijau: analog. Biru: komunikasi digital. Ungu: kendali dan status.</text><text x="56" y="726.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Garis putus menunjukkan hubungan antarmodul sensor.</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#5D7180">01 / 9</text></svg>