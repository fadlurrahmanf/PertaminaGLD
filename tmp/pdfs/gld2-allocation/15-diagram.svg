<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">15  Engineering notes and unresolved quantities</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Schematic-based calculation boundaries. These are document corrections and findings, not hardware modifications.</text><rect x="40" y="138" width="540" height="175" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="138" width="5" height="175" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="164.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">4.2 V battery: meaningful lower-bound example</text><text x="56" y="188.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">At the 5.000 V heater resistance reference:</text><text x="56" y="206.85999999999999" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">6.57468 W / 4.2 V = 1.56540 A.</text><text x="56" y="225.05999999999997" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">This is the ideal source current for that heater case only.</text><text x="56" y="243.25999999999996" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Actual current includes electronics, alarm and losses.</text><text x="56" y="261.46" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">No battery runtime is claimed without capacity.</text><rect x="610" y="138" width="550" height="175" rx="8" fill="white" stroke="#CCD7DE"/><rect x="610" y="138" width="5" height="175" rx="2" fill="#AD4D35" stroke="#AD4D35"/><text x="626" y="164.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Alarm cannot yet have a numeric load</text><text x="626" y="188.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">BYS / YS-01 / YS-02 is not one identified part.</text><text x="626" y="206.85999999999999" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">The schematic supplies a nominal 24 V alarm.</text><text x="626" y="225.05999999999997" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Ex marking and sound level do not determine watts.</text><text x="626" y="243.25999999999996" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Keep IAL symbolic until manufacturer, 24 V variant,</text><text x="626" y="261.46" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">operating current and inrush are identified.</text><rect x="40" y="341" width="540" height="173" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="341" width="5" height="173" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="367.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Small paths that must remain in the budget</text><text x="56" y="391.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Buck FB: 4.98848 / 119.1k = 41.885 µA.</text><text x="56" y="409.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Selector PR1: 4.98848 / 20.99k = 237.660 µA.</text><text x="56" y="428.06" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Boost FB: 5.26750 / 245k = 21.500 µA.</text><text x="56" y="446.26" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Alarm FB: 24.21130 / 197k = 122.900 µA.</text><text x="56" y="464.46" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">A low 10k pull-up draws Vrail / 10k while low.</text><rect x="610" y="341" width="550" height="173" rx="8" fill="white" stroke="#CCD7DE"/><rect x="610" y="341" width="5" height="173" rx="2" fill="#AD4D35" stroke="#AD4D35"/><text x="626" y="367.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Limits are not consumption</text><text x="626" y="391.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">TPS62162: 1 A output rating, not a 1 A load.</text><text x="626" y="409.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">TPS2116: 2.5 A rating, not normal supply current.</text><text x="626" y="428.06" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">TPS61175: 3 A switch rating, not 3 A at 24 V.</text><text x="626" y="446.26" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Check thermal, inductor, switch and transient limits</text><text x="626" y="464.46" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">with the complete operating-point budget.</text><text x="40" y="559.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Passive-load handling: capacitor charging requires I = C × dV/dt. Ferrite “600 Ω” is an AC impedance label, not DC resistance. The module’s 1k QOD resistor is a discharge path, not a</text><text x="40" y="577.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">continuous 5 mA on-state load. Reference/filter resistors do not automatically draw V/R when their far end is high impedance.</text><text x="40" y="637.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Provenance: motherboard connections come from the original ZIP and PCB net map; the +5V-to-motherboard-+5VA filter is from the user’s later 5VA.png detail. The reference module is a</text><text x="40" y="655.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">separate image. Sensor names come from BoardPinsGLD2.h. Original design files and firmware were not changed.</text><text x="40" y="704.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Source interaction: the external +24V filter has no series reverse-block diode; boost operation and backfeed depend on source/control states. USB VBUS also reaches the AON diode OR. These paths prevent</text><text x="40" y="721.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">an unconditional single total-current figure.</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">15 / 17</text></svg>