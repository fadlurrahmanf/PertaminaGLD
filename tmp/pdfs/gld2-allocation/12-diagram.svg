ly="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">6.60 µW</text><text x="814" y="341.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Sleep only [S11]</text><rect x="40" y="360" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="378.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">SHT40, measurement</text><text x="419" y="378.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">320 / 500 µA</text><text x="594" y="378.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">1.056 / 1.650 mW</text><text x="814" y="378.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Typ / max; heater off [S12]</text><rect x="40" y="397" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="415.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">SHT40, highest heater setting</text><text x="419" y="415.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">60 / 100 mA</text><text x="594" y="415.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">198 / 330 mW</text><text x="814" y="415.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Typ / max; during heating [S12]</text><rect x="40" y="434" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="452.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">THVD1410, receiver only</text><text x="419" y="452.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">0.700 / 0.960 mA</text><text x="594" y="452.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">2.310 / 3.168 mW</text><text x="814" y="452.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Typ / max, unloaded [S15]</text><rect x="40" y="471" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="489.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">THVD1410, driver only</text><text x="419" y="489.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">2.0 / 2.5 mA</text><text x="594" y="489.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">6.60 / 8.25 mW</text><text x="814" y="489.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Typ / max; add line load [S15]</text><rect x="40" y="508" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="526.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">PCF8574, NXP reference at 6 V</text><text x="419" y="526.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">40 / 100 µA</text><text x="594" y="526.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">240 / 600 µW at 6 V</text><text x="814" y="526.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">100 kHz, unloaded [S14]</text><rect x="40" y="545" width="1120" height="37" rx="0" fill="white" stroke="white"/><text x="49" y="563.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">CH340C, active at 3.3 V</text><text x="419" y="563.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">4 / 12 mA</text><text x="594" y="563.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">13.2 / 39.6 mW</text><text x="814" y="563.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">25°C; excludes USB pins [S32]</text><rect x="40" y="582" width="1120" height="37" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="600.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">TCA9548A, reference at 5.5 V</text><text x="419" y="600.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">9 / 30 µA</text><text x="594" y="600.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">49.5 / 165 µW at 5.5 V</text><text x="814" y="600.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">100 kHz, unloaded [S13]</text><text x="40" y="657.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">PCF8574 vendor is unconfirmed: the NXP 6 V case is a reference, not a verified 3.3 V board value. TCA9548A is on +5V; its table above uses the specified 5.5 V test point. Its 400 kHz reference rises to 50 /</text><text x="40" y="674.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">80 µA. Do not silently use either test voltage as the actual rail.</text><text x="40" y="721.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">ESP32 memory/I/O loads and duty cycle remain additional conditions. VCC also supplies ADS DVDD, pull-ups and LED. CH340C USB suspend is 40 µA typ / 150 µA max at 3.3 V (132 / 495 µW).</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">12 / 17</text></svg>