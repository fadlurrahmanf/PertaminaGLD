-weight="700" fill="#183044">Wake inverter</text><text x="471" y="404.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">SN74LVC1G06</text><text x="471" y="421.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">WAKE to PRE</text><rect x="875" y="355" width="285" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="875" y="355" width="5" height="115" rx="2" fill="#8060AC" stroke="#8060AC"/><text x="891" y="381.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Power latch</text><text x="891" y="404.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">SN74AUP1G74</text><text x="891" y="421.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Controls ENA</text><polyline points="295,410 455,410" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="455,410 447.79642318117857,413.4797242728898 447.79642318117857,406.5202757271102" fill="#8060AC"/><rect x="349" y="385" width="38.39306640625" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="352" y="396.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#8060AC">WAKE</text><polyline points="715,410 875,410" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="875,410 867.7964231811786,413.4797242728898 867.7964231811786,406.5202757271102" fill="#8060AC"/><rect x="782" y="385" width="28.61767578125" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="785" y="396.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#8060AC">PRE</text><polyline points="1020,260 1020,310 170,310 170,355" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="170,355 166.52027572711015,347.79642318117857 173.47972427288985,347.79642318117857" fill="#B86518"/><rect x="499" y="281" width="78.7783203125" height="15" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="502" y="292.02" font-fami