<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">03  Always-on, watchdog, dan latch</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#5D7180">3V3AON tetap dipisahkan dari VCC; ENA mengendalikan jalur baterai dan boost 5 V.</text><rect x="40" y="140" width="260" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="140" width="5" height="110" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="166.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Sumber always-on</text><text x="56" y="189.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Baterai, buck, 5VEXT,</text><text x="56" y="206.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">dan VBUS USB digabungkan</text><rect x="385" y="140" width="260" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="385" y="140" width="5" height="110" rx="2" fill="#B86518" stroke="#B86518"/><text x="401" y="166.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Regulator always-on</text><text x="401" y="189.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Keluaran 3V3AON</text><text x="401" y="206.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Proteksi pada VBUS</text><rect x="735" y="140" width="425" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="735" y="140" width="5" height="110" rx="2" fill="#B86518" stroke="#B86518"/><text x="751" y="166.3"