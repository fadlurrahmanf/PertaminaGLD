<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">10  Voltage calculations</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Nominal resistor values from the schematic. These values exclude tolerance, ripple and load-dependent path drops.</text><rect x="40" y="140" width="1120" height="43" rx="3" fill="#183044" stroke="#183044"/><text x="49" y="159.66" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">Rail / device</text><text x="369" y="159.66" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">Calculation from schematic</text><text x="809" y="159.66" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">Result</text><text x="1024" y="159.66" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">Source</text><rect x="40" y="183" width="1120" height="43" rx="0" fill="white" stroke="white"/><text x="49" y="202.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">5VBUCK / LMR51450</text><text x="369" y="202.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">0.8 × (1 + 100k / 19.1k)</text><text x="809" y="202.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">4.98848 V</text><text x="1024" y="202.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">S01</text><rect x="40" y="226" width="1120" height="43" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="245.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">5VBOOST / TPS61088, PWM</text><text x="369" y="245.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">1.204 × (1 + 189k / 56k)</text><text x="809" y="245.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">5.26750 V</text><text x="1024" y="245.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">S02</text><rect x="40" y="269" width="1120" height="43" rx="0" fill="white" stroke="white"/><text x="49" y="288.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">5VBOOST / TPS61088, PFM</text><text x="369" y="288.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">1.212 × (1 + 189k / 56k)</text><text x="809" y="288.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">5.30250 V</text><text x="1024" y="288.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">S02</text><rect x="40" y="312" width="1120" height="43" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="331.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Alarm boost, before SS54</text><text x="369" y="331.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">1.229 × (1 + 187k / 10k)</text><text x="809" y="331.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">24.21130 V</text><text x="1024" y="331.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">S03</text><rect x="40" y="355" width="1120" height="43" rx="0" fill="white" stroke="white"/><text x="49" y="374.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">VCC / TPS62162</text><text x="369" y="374.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Fixed output option</text><text x="809" y="374.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">3.3 V</text><text x="1024" y="374.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">S04</text><rect x="40" y="398" width="1120" height="43" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="417.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">3V3AON / TPS7A0233</text><text x="369" y="417.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Fixed output option</text><text x="809" y="417.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">3.3 V</text><text x="1024" y="417.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">S06</text><rect x="40" y="441" width="1120" height="43" rx="0" fill="white" stroke="white"/><text x="49" y="460.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">VMID, unloaded</text><text x="369" y="460.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">VA × 10k / (10k + 10k)</text><text x="809" y="460.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">VA / 2</text><text x="1024" y="460.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Schematic</text><rect x="40" y="484" width="1120" height="43" rx="0" fill="#EAF0F4" stroke="#EAF0F4"/><text x="49" y="503.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Battery monitor at 4.2 V</text><text x="369" y="503.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">4.2 × 100k / (200k + 100k)</text><text x="809" y="503.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">1.4 V</text><text x="1024" y="503.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">Schematic</text><rect x="40" y="562" width="540" height="165" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="562" width="5" height="165" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="588.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Actual rail voltage</text><text x="56" y="612.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">V5 = selected buck/boost voltage minus selector drop,</text><text x="56" y="630.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">or 5VEXT minus diode drop.</text><text x="56" y="649.0600000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">VA = V5 minus analog-filter DC drop.</text><text x="56" y="667.2600000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">VA24 = external or boosted source minus path drops.</text><rect x="610" y="562" width="550" height="165" rx="8" fill="white" stroke="#CCD7DE"/><rect x="610" y="562" width="5" height="165" rx="2" fill="#AD4D35" stroke="#AD4D35"/><text x="626" y="588.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Source compatibility needs verification</text><text x="626" y="612.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">The backup set point is above 5.25 V (ADS AVDD limit)</text><text x="626" y="630.86" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">and 5.1 V (the reference MQ heater upper limit).</text><text x="626" y="649.0600000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">A diode/filter drop is load-dependent; it does not</text><text x="626" y="667.2600000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">prove the output is within range.</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">10 / 17</text></svg>