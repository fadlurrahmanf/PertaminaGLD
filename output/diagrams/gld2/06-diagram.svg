<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">06  I2C and sensor control</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">I2C selects sensor branches, sets the DAC, and controls each module power supply.</text><rect x="80" y="160" width="270" height="125" rx="8" fill="white" stroke="#CCD7DE"/><rect x="80" y="160" width="5" height="125" rx="2" fill="#316FC0" stroke="#316FC0"/><text x="96" y="186.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">ESP32</text><text x="96" y="209.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Main I2C bus</text><text x="96" y="226.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Controls acquisition and control</text><text x="96" y="243.44000000000003" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">(ESP32-S3-WROOM)</text><rect x="465" y="135" width="280" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="465" y="135" width="5" height="115" rx="2" fill="#316FC0" stroke="#316FC0"/><text x="481" y="161.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">I2C branch selector</text><text x="481" y="184.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Selects one of</text><text x="481" y="201.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">eight sensor modules</text><text x="481" y="218.44000000000003" font-family="Arial,sans-serif" font-