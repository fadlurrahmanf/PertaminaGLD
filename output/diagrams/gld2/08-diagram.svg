<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F4F7F9" stroke="#F4F7F9"/><text x="38" y="33.019999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#147B75">PERTAMINA GLD   /   SCHEMATIC BLOCK DIAGRAM</text><text x="38" y="73.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183044">08  Alarm, battery, and power status</text><text x="38" y="101.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#183044">The +24 V alarm rail can be supplied by external 24 V input or battery boost.</text><rect x="40" y="145" width="260" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="145" width="5" height="115" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="171.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">24 V input</text><text x="56" y="194.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">External 24 V</text><text x="56" y="211.64000000000001" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Feeds the +24 V rail directly</text><rect x="40" y="315" width="260" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="315" width="5" height="115" rx="2" fill="#B86518" stroke="#B86518"/><text x="56" y="341.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Battery</text><text x="56" y="364.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Supplies alarm boost</text><text x="56" y="381.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">when battery power is active</text><rect x="390" y="315" width="260" height="115" rx="8" fill="white" stroke="#CCD7DE"/><rect x="390" y="315" width="5" height="115" rx="2" fill="#B86518" stroke="#B86518"/><text x="406" y="341.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Boost to 24 V</text><text x="406" y="364.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Raises battery voltage</text><text x="406" y="381.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">to the alarm rail</text><text x="406" y="398.44" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">(TPS61175)</text><rect x="860" y="200" width="300" height="140" rx="8" fill="white" stroke="#CCD7DE"/><rect x="860" y="200" width="5" height="140" rx="2" fill="#B86518" stroke="#B86518"/><text x="876" y="226.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">+24 V rail</text><text x="876" y="249.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Source: external input</text><text x="876" y="266.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">or battery boost</text><text x="876" y="283.44" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">For alarm output</text><polyline points="300,200 860,200" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="860,200 852.7964231811786,203.47972427288985 852.7964231811786,196.52027572711015" fill="#B86518"/><rect x="517" y="176" width="70.818359375" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="520" y="187.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#B86518">external 24 V</text><polyline points="300,370 390,370" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="390,370 382.79642318117857,373.4797242728898 382.79642318117857,366.5202757271102" fill="#B86518"/><polyline points="650,370 760,370 760,300 860,300" fill="none" stroke="#B86518" stroke-width="1.8"/><polygon points="860,300 852.7964231811786,303.4797242728898 852.7964231811786,296.5202757271102" fill="#B86518"/><rect x="671" y="346" width="58.59375" height="16" rx="2" fill="#F4F7F9" stroke="#F4F7F9"/><text x="674" y="357.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#B86518">boost 24 V</text><rect x="40" y="545" width="260" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="545" width="5" height="110" rx="2" fill="#8060AC" stroke="#8060AC"/><text x="56" y="571.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Alarm command</text><text x="56" y="594.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">ESP32 controls the</text><text x="56" y="611.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">alarm switch</text><rect x="390" y="545" width="260" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="390" y="545" width="5" height="110" rx="2" fill="#8060AC" stroke="#8060AC"/><text x="406" y="571.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Alarm switch</text><text x="406" y="594.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Connects the load</text><text x="406" y="611.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">to GND</text><rect x="860" y="545" width="300" height="110" rx="8" fill="white" stroke="#CCD7DE"/><rect x="860" y="545" width="5" height="110" rx="2" fill="#B86518" stroke="#B86518"/><text x="876" y="571.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Alarm output</text><text x="876" y="594.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">+24 V and switched GND</text><text x="876" y="611.64" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Flyback diode provided</text><polyline points="300,600 390,600" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="390,600 382.79642318117857,603.4797242728898 382.79642318117857,596.5202757271102" fill="#8060AC"/><polyline points="650,600 860,600" fill="none" stroke="#8060AC" stroke-width="1.8"/><polygon points="860,600 852.7964231811786,603.4797242728898 852.7964231811786,596.5202757271102" fill="#8060AC"/><rect x="40" y="670" width="340" height="65" rx="8" fill="white" stroke="#CCD7DE"/><rect x="40" y="670" width="5" height="65" rx="2" fill="#147B75" stroke="#147B75"/><text x="56" y="696.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Battery monitoring</text><text x="56" y="719.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Voltage divider to ESP32</text><rect x="420" y="670" width="350" height="65" rx="8" fill="white" stroke="#CCD7DE"/><rect x="420" y="670" width="5" height="65" rx="2" fill="#8060AC" stroke="#8060AC"/><text x="436" y="696.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Power status</text><text x="436" y="719.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Buck and source-selector status</text><rect x="810" y="670" width="350" height="65" rx="8" fill="white" stroke="#CCD7DE"/><rect x="810" y="670" width="5" height="65" rx="2" fill="#8060AC" stroke="#8060AC"/><text x="826" y="696.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183044">Local interface</text><text x="826" y="719.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#183044">Configuration button and status LED</text><text x="1035" y="773.2" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#183044">08 / 9</text></svg>